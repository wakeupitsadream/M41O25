name: CI

on:
  push:
    # main и рабочие ветки; для веток dependabot и форков хватает прогона по pull_request — иначе каждый PR шёл дважды.
    branches: [main, "claude/**"]
  pull_request:

# Токену job хватает чтения: workflow ничего не пишет в репозиторий.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raspison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/raspison
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
      ANON_PEPPER: ci-pepper-0123456789abcdef0123456789
      CRON_SECRET: ci-cron-secret
      OCR_MOCK: "1"
      APP_TZ: Asia/Yekaterinburg
      NEXT_PUBLIC_APP_TZ: Asia/Yekaterinburg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - name: История миграций без коллизий
        run: npm run db:check
      - name: Схема не разошлась с миграциями
        # drizzle-kit check смотрит только историю снапшотов; дрейф lib/db/schema.ts без db:generate он не ловит,
        # а production применяет только то, что лежит в drizzle/. Поэтому генерируем и требуем чистого git status.
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::lib/db/schema.ts изменён без миграции — запусти npm run db:generate и закоммить drizzle/"
            git status --porcelain drizzle
            exit 1
          fi
      - name: Unit-тесты
        run: npm test
      - name: База для e2e
        run: npm run db:migrate && npm run db:seed -- --demo
      - name: Сборка (как на Vercel, без миграций)
        run: npm run build
      - name: Версия Playwright для кэша браузера
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium для Playwright
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Production-сервер
        run: |
          (npx next start -p 3001 > server.log 2>&1 &)
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/enter || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "server: $code"
          [ "$code" = "200" ]
      - name: e2e
        env:
          BASE: http://localhost:3001
          STRICT_NAV: "1"
        run: npm run e2e && npm run e2e:offline
      - name: Cron и бэкап в локальное хранилище
        # Два самых редко исполняемых и самых важных куска кода: ночной прогон и дамп. Локально хранилище —
        # папка .data/uploads, так что бэкап ложится на диск раннера и его можно восстановить ниже.
        run: |
          curl -sf -H "Authorization: Bearer $CRON_SECRET" http://localhost:3001/api/cron/daily -o cron.json || { cat cron.json 2>/dev/null; exit 1; }
          node -e 'const r=require("./cron.json"); console.log(JSON.stringify(r)); if (!r.ok || !r.backup) process.exit(1)'
      - name: Репетиция восстановления из бэкапа
        env:
          RESTORE_URL: postgres://postgres:postgres@localhost:5432/raspison_restore
        run: |
          psql "$DATABASE_URL" -c 'create database raspison_restore'
          DATABASE_URL="$RESTORE_URL" npm run db:migrate
          DATABASE_URL="$RESTORE_URL" npm run db:restore -- .data/uploads/backups/*.json.gz --truncate
          users=$(psql "$RESTORE_URL" -Atc 'select count(*) from users')
          echo "restored users: $users"
          [ "$users" -gt 0 ]
      - name: Логи и скриншоты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/shots
            server.log
          if-no-files-found: ignore
